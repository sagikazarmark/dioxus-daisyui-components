[package]
name = "dioxus-daisyui-components"
version = "0.1.0"
description = "Dioxus components pairing dioxus-primitives behaviour with daisyUI class names."
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/dioxus-daisyui-components"

[features]
default = []
preview = [
    "dep:dioxus-code",
    "dep:dioxus-registry-preview",
    "dep:serde_json",
    "dioxus/launch",
    "dioxus/router",
]
# `dx --platform` selects the renderer; documentation and highlighting are shared.
web = ["preview", "dioxus/web", "dioxus-primitives/web"]
desktop = ["preview", "dioxus/desktop"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["lib"] }
# The Preview renders the highlighted Example sources `dioxus-registry-preview`
# produces at compile time; the facade re-exports the source types but not the
# `Code` component or its palettes, so the renderer is a dependency of its own.
dioxus-code = { version = "0.1.2", default-features = false, optional = true }
dioxus-field = "0.7.0"
dioxus-primitives = { version = "0.0.1", git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", default-features = false, features = ["router"] }
dioxus-registry-preview = { version = "0.2.0", optional = true, features = ["syntax-highlighting"] }
# `schemaform_daisyui` renders `schemaform` forms. The Component's manifest
# declares the same requirement for installs.
schemaform = "0.5.0"
schemaform-dioxus = "0.5.0"
# The `schemaform_daisyui` Examples parse their form data from JSON text.
serde_json = { version = "1", optional = true }
# Date Components need the JS clock on wasm even without the Preview; time keeps
# using the native clock on desktop. Their install manifests enable it too.
time = { version = "0.3.44", features = ["local-offset", "macros", "wasm-bindgen"] }
# Not used directly. The lockfile's wasm-bindgen must match the wasm-bindgen-cli
# the devenv provides, or `dx build` refuses to bundle the preview locally; this
# holds the resolution to that release. Bump both together.
wasm-bindgen = "=0.2.126"

[dev-dependencies]
dioxus-html = { version = "0.7", features = ["serialize"] }
dioxus-registry-preview = "0.2.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "preview"
path = "src/preview/main.rs"
required-features = ["preview"]
